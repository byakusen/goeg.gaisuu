<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>がい数の れんしゅう</title>
<style>
  :root{
    --paper:#FBFAF3;
    --rule:#D7E5EE;
    --ink:#1E2A33;
    --pencil:#5D6B75;
    --red:#E0332B;
    --blue:#2B6795;
    --green:#1B9260;
    --amber:#F0B429;
    --cell: clamp(28px, min(8.6vw, 8.4vh), 68px);
    --cellh: calc(var(--cell) * 1.25);
    --font: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px;
    min-height:100vh;
    padding:clamp(6px,1.4vh,14px) 12px clamp(8px,1.6vh,20px);
  }
  .app{max-width:860px;margin:0 auto}

  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:clamp(3px,.9vh,10px)}
  .head h1{font-size:clamp(17px,4vw,25px);margin:0;letter-spacing:.04em}
  .head h1 span{color:var(--blue)}
  .score{font-size:13px;color:var(--pencil);white-space:nowrap;background:#fff;border:2px solid var(--rule);border-radius:999px;padding:4px 12px}
  .score b{color:var(--green);font-size:17px}

  .tabs{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
  .tab{
    flex:1;appearance:none;cursor:pointer;
    font-family:var(--font);font-size:clamp(11px,2.6vw,15px);font-weight:700;min-width:92px;
    color:var(--pencil);background:#F1EEE3;
    border:2px solid var(--rule);border-bottom:none;
    border-radius:12px 12px 0 0;padding:clamp(6px,1.3vh,11px) 3px clamp(5px,1.2vh,10px);
    transition:transform .12s ease, background .12s ease;
  }
  .tab:hover{background:#fff}
  .tab[aria-selected="true"]{
    background:#fff;color:var(--blue);border-color:var(--blue);
    box-shadow:0 -3px 0 var(--blue) inset;transform:translateY(-3px)
  }
  .tab:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  .sheet{background:#fff;border:2px solid var(--blue);border-radius:0 0 14px 14px;
         padding:clamp(7px,1.4vh,14px) 12px clamp(8px,1.8vh,18px)}

  .qbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .q{font-size:clamp(13px,min(3.5vw,2.5vh),20px);font-weight:700;line-height:1.5;margin:0}
  .q em{font-style:normal;color:var(--red);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
  .q small{display:block;font-size:.68em;color:var(--pencil);font-weight:600;margin-top:3px}

  .steps{display:flex;gap:6px;margin:clamp(6px,1.4vh,14px) 0 5px;flex-wrap:wrap}
  .stp{font-size:11.5px;color:var(--pencil);background:#F4F2EA;border-radius:8px;padding:5px 9px}
  .stp.on{background:var(--amber);color:#3A2B00;font-weight:700}
  .stp.done{background:#E4F4EC;color:var(--green)}

  /* ---- 左：ノート面 ／ 右：そうさパネル ---- */
  .play{display:flex;gap:clamp(8px,2.5vw,26px);align-items:stretch;justify-content:center;margin-top:clamp(6px,1.8vh,18px)}
  .board{flex:1 1 auto;display:flex;justify-content:center;min-width:0;padding-top:4px;
         min-height:calc(var(--cellh) * 3.2 + clamp(20px,5vh,80px))}
  .gridwrap{position:relative;padding-right:calc(var(--cell) * 1.15)}
  .gridwrap.wide{width:100%;padding-right:0}
  .grid{display:grid;justify-items:center;align-items:center;row-gap:2px}
  .panel{flex:0 0 auto;width:clamp(150px,30vw,210px);display:flex;flex-direction:column;align-items:center;
         gap:clamp(4px,1vh,10px);
         border-left:2px dashed var(--rule);padding-left:clamp(8px,2.4vw,18px);min-height:200px}
  .panel .cap{font-size:12px;color:var(--pencil);align-self:flex-start;line-height:1.5;min-height:3.6em}

  .lbl{font-size:clamp(9px,2.2vw,12px);color:var(--pencil);height:18px;line-height:18px}
  .top{height:calc(var(--cellh) * .62);width:var(--cell);display:flex;align-items:flex-end;justify-content:center;
       font-size:calc(var(--cell) * .72);font-weight:700;line-height:1}
  .top span{display:inline-block;animation:pop .28s cubic-bezier(.2,1.5,.5,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.6)}to{opacity:1;transform:none}}

  .dg{position:relative;width:var(--cell);height:var(--cellh);display:flex;align-items:center;justify-content:center;
      font-size:calc(var(--cell) * .86);font-weight:600;line-height:1;border-radius:10px}
  .dg.tapable{cursor:pointer}
  .dg.tapable:hover{background:#FFF6D8}
  .dg.shake{animation:shake .38s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .dg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .pen{fill:none;stroke:var(--red);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .slash{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
  .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .45s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  .norow{height:calc(var(--cell) * .5);width:var(--cell);display:flex;align-items:flex-start;justify-content:center;
         font-size:calc(var(--cell) * .44);font-weight:700;color:var(--ink);line-height:1}
  .norow span{display:inline-block;animation:pop .3s cubic-bezier(.2,1.5,.5,1) both}

  /* ---- がい数のはんい ---- */
  .fmt{appearance:none;cursor:pointer;font-family:var(--font);font-size:clamp(11px,2.7vw,14px);font-weight:700;
       color:var(--pencil);background:#F4F2EA;border:2px solid var(--rule);border-radius:999px;padding:6px 13px}
  .fmt.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fmt:disabled{opacity:.5;cursor:default}
  .numline{width:100%;max-width:660px;display:block;margin:6px auto 0}
  .rangebox{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;--rslot:calc(var(--cell) * .6)}
  .ansline{display:flex;align-items:center;justify-content:center;gap:clamp(3px,1.2vw,10px);flex-wrap:nowrap;
           margin-top:clamp(12px,4vh,36px)}
  .sbgrid{display:grid;grid-template-columns:auto auto;gap:20px clamp(4px,1.5vw,10px);
          align-items:center;justify-content:center;margin-top:clamp(10px,3.4vh,30px)}
  .sblab{font-size:clamp(12px,2.9vw,17px);font-weight:700;text-align:right;white-space:nowrap}
  .abox{display:flex;align-items:center;gap:2px;cursor:pointer}
  .paren{font-size:calc(var(--rslot) * 1.5);color:var(--blue);line-height:1;margin:0 -.22em}
  .rslot{width:var(--rslot);height:calc(var(--rslot) * 1.5);display:flex;align-items:center;justify-content:center;
         font-size:calc(var(--rslot) * 1.1);font-weight:600;line-height:1;border-bottom:3px solid var(--rule);border-radius:4px}
  .abox.on .rslot{border-bottom-color:var(--amber)}
  .abox.on .rslot.next{background:#FFFBEC}
  .rslot.filled{border-bottom-color:var(--pencil)}
  .rslot.ok{border-bottom-color:var(--green)}
  .rslot.ng{animation:shake .38s}
  .lab{font-size:clamp(14px,3.4vw,20px);font-weight:700;padding-bottom:4px;white-space:nowrap}

  /* ---- 約何万 ---- */
  .aboutbox{width:100%;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
  .abtline{width:100%;max-width:660px;display:block;margin:0 auto}
  .choices{display:flex;gap:clamp(10px,3vw,28px);justify-content:center;margin-top:6px}
  .choice{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;
          font-size:calc(var(--cell) * .5);color:var(--ink);background:#fff;
          border:3px solid var(--blue);border-radius:14px;padding:10px 20px;box-shadow:0 4px 0 var(--blue)}
  .choice:active{transform:translateY(4px);box-shadow:none}
  .choice.pick{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 0 #147a4e}
  .choice.ngc{animation:shake .38s}
  .choice:disabled{cursor:default}

  /* ---- 応用問題 ---- */
  .applybox{width:100%;display:flex;flex-direction:column;align-items:center}
  .items{display:flex;gap:clamp(6px,2vw,20px);justify-content:center;flex-wrap:wrap}
  .item{background:#FFF8E6;border:2px solid #E0B45C;border-radius:12px;padding:7px 14px;text-align:center;min-width:92px}
  .item .nm{font-size:12px;color:#8A6A2A}
  .item .pr{font-size:clamp(17px,3.8vw,25px);font-weight:700;line-height:1.2}
  .item .est{font-size:clamp(11px,2.6vw,14px);font-weight:700;line-height:1.3;margin-top:2px;color:var(--red)}
  .lead{font-size:clamp(12px,2.8vw,15px);color:var(--pencil);margin-top:clamp(5px,1.4vh,12px)}
  .formula{font-size:clamp(18px,4.2vw,28px);font-weight:700;margin-top:4px;text-align:center;
           background:#F4F8FB;border:2px solid var(--blue);border-radius:999px;padding:6px 22px}
  .sent{font-size:clamp(13px,3vw,17px);line-height:2;margin-top:clamp(6px,1.6vh,14px);text-align:center;max-width:620px}
  .sent b{color:var(--red)}
  .blank{display:inline-block;min-width:96px;border:3px solid var(--blue);border-radius:8px;padding:1px 10px;
         margin:0 3px;background:#fff;font-weight:700;color:var(--blue);text-align:center}
  .blank.empty{color:#C2CDD4}
  .blank.ok{border-color:var(--green);color:var(--green)}
  .blank.ng{animation:shake .38s}
  .picks{display:flex;flex-direction:column;gap:clamp(4px,1vh,8px);align-items:center;margin-top:clamp(6px,1.6vh,14px)}
  .prow{display:flex;gap:clamp(6px,2vw,14px);flex-wrap:wrap;justify-content:center}
  .pbtn{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;
        font-size:clamp(13px,3.2vw,19px);color:var(--ink);background:#fff;
        border:3px solid var(--blue);border-radius:12px;padding:8px 16px;box-shadow:0 3px 0 var(--blue)}
  .pbtn:active{transform:translateY(3px);box-shadow:none}
  .pbtn.on{background:var(--blue);color:#fff}
  .pbtn:disabled{cursor:default;opacity:.55}

  /* ---- がい算 ---- */
  .gaibox{width:100%;max-width:100%;display:flex;flex-direction:column;align-items:center;overflow-x:auto;
          --rslot:calc(var(--cell) * .5)}
  .gaigrid{display:grid;grid-template-columns:repeat(5,auto);justify-content:center;align-items:center;
           column-gap:clamp(2px,1vw,10px);row-gap:4px;margin-top:clamp(4px,1.4vh,10px)}
  .gnum{font-size:calc(var(--rslot) * 1.02);font-weight:600;line-height:1;white-space:nowrap;text-align:center}
  .gop{font-size:calc(var(--rslot) * 1.02);font-weight:700;line-height:1;text-align:center}
  .gdown{display:flex;justify-content:center;padding:2px 0}
  .gdown svg{width:22px;height:34px;overflow:visible}
  .abox.frame{border:3px solid var(--blue);border-radius:10px;padding:3px 5px;background:#fff}
  .abox.frame.on{border-color:var(--amber);background:#FFFBEC}
  .abox.frame .rslot{border-bottom:none;height:calc(var(--rslot) * 1.35)}

  .arrowcell{height:52px;display:flex;align-items:center;justify-content:center}
  .arrowcell svg{width:var(--cell);height:52px;overflow:visible}
  .arrow{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

  .ans{width:var(--cell);height:var(--cellh);display:flex;align-items:center;justify-content:center;
       font-size:calc(var(--cell) * .86);font-weight:600;line-height:1;
       border-bottom:3px solid var(--rule);border-radius:4px}
  .ans.cur{border-bottom-color:var(--amber);background:#FFFBEC}
  .ans.filled{border-bottom-color:var(--pencil)}
  .ans.ok{border-bottom-color:var(--green)}
  .ans.ng{animation:shake .38s}

  .hanamaru{position:absolute;pointer-events:none;width:calc(var(--cell) * 2.3);opacity:0;
            animation:stamp .5s cubic-bezier(.2,1.6,.45,1) forwards}
  @keyframes stamp{
    0%{opacity:0;transform:scale(2.1) rotate(-24deg)}
    60%{opacity:1;transform:scale(.92) rotate(4deg)}
    100%{opacity:1;transform:scale(1) rotate(-3deg)}
  }
  .hanamaru.fade{animation:fadeout .45s ease forwards}
  @keyframes fadeout{
    from{opacity:1;transform:scale(1) rotate(-3deg)}
    to{opacity:0;transform:scale(1.3) rotate(-3deg)}
  }

  .big{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;
       font-size:clamp(14px,min(3.6vw,2.4vh),19px);line-height:1.2;color:var(--ink);background:#fff;width:100%;
       border:3px solid var(--ink);border-radius:14px;padding:clamp(6px,1.2vh,14px) 8px;box-shadow:0 4px 0 var(--ink)}
  .big:active{transform:translateY(4px);box-shadow:none}
  .big.up{border-color:var(--blue);box-shadow:0 4px 0 var(--blue);color:var(--blue)}
  .big.down{border-color:#8A5AA8;box-shadow:0 4px 0 #8A5AA8;color:#8A5AA8}
  .big:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
  .big:disabled{opacity:.35;cursor:default;box-shadow:0 3px 0 #E3E9ED;border-color:#C9D3DA;color:var(--pencil)}
  .big.nextbtn:disabled{opacity:1}
  .nextbtn{margin-top:auto;background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 0 #1B4664;
           font-size:clamp(14px,min(3.6vw,2.4vh),19px)}
  .nextbtn:active{box-shadow:none}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,min(1.4vw,.9vh),8px);width:100%}
  .key{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:clamp(16px,min(4.6vw,3.3vh),26px);
       line-height:1.15;
       background:#fff;color:var(--ink);border:2px solid var(--pencil);border-radius:12px;padding:clamp(3px,min(2vw,1.05vh),12px) 0;
       box-shadow:0 3px 0 #C9D3DA}
  .key:active{transform:translateY(3px);box-shadow:none}
  .key.sub{font-size:clamp(10px,2.4vw,14px);color:var(--pencil)}
  .key:disabled{opacity:.4;cursor:default;box-shadow:0 3px 0 #E3E9ED}
  .key:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  .msg{min-height:3.1em;line-height:1.55;margin-top:clamp(5px,1.2vh,12px);text-align:center;font-size:clamp(13px,3.3vw,18px);font-weight:700}
  .msg.good{color:var(--green)}
  .msg.bad{color:var(--red)}
  .msg.tip{color:var(--pencil);font-weight:500}

  .rule{margin-top:clamp(3px,.9vh,10px);text-align:center;position:relative}
  .rule button{appearance:none;background:none;border:none;font-family:var(--font);font-size:13px;
               color:var(--blue);text-decoration:underline;cursor:pointer}
  /* きまりは ふきだしで 出す（開いても 画面の 大きさが 変わらないように） */
  .rulebox{display:none;position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
           width:min(440px,92vw);margin-bottom:8px;z-index:20;
           background:#F4F8FB;border:2px dashed var(--blue);box-shadow:0 6px 18px rgba(30,42,51,.18);
           border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;text-align:left}
  .rulebox.show{display:block}
  .rulebox b{color:var(--red)}

  /* ---- 小タブ（2だん）---- */
  .steps.col{flex-direction:column;align-items:flex-start;gap:8px}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sub{appearance:none;cursor:pointer;font-family:var(--font);font-size:clamp(11px,2.7vw,14px);font-weight:700;
       color:var(--blue);background:#fff;border:2px solid var(--blue);border-radius:10px;padding:6px 14px}
  .sub.on{background:var(--blue);color:#fff}
  .sub:disabled{opacity:.5;cursor:default}

  /* ---- 補足のふきだし ---- */
  .note{margin-top:clamp(6px,1.6vh,14px);max-width:620px;background:#FFF6F5;border:2px dashed var(--red);border-radius:12px;
        padding:9px 14px;font-size:clamp(12px,2.8vw,15px);line-height:1.75;text-align:left}
  .note b{color:var(--red)}
  .note.calm{background:#F4F8FB;border-color:var(--blue)}
  .note.calm b{color:var(--blue)}

  /* ---- がい数のはんい：カード ---- */
  .cardbox{width:100%;display:flex;flex-direction:column;align-items:center}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,min(1.6vw,1.4vh),14px);
         width:100%;max-width:620px;margin-top:4px}
  .card{appearance:none;cursor:pointer;font-family:var(--font);font-weight:700;
        font-size:clamp(15px,3.8vw,26px);color:var(--ink);background:#fff;
        border:3px solid var(--pencil);border-radius:14px;padding:clamp(6px,min(2.4vw,1.9vh),18px) 2px;
        box-shadow:0 4px 0 #C9D3DA}
  .card:active{transform:translateY(4px);box-shadow:none}
  .card.on{background:#FFF6D8;border-color:var(--amber);box-shadow:0 4px 0 #D79E1E}
  .card.ng{animation:shake .38s}
  .card:disabled{cursor:default;opacity:.45;box-shadow:none;transform:translateY(4px)}
  .card.hit{opacity:1;background:#E4F4EC;border-color:var(--green);color:var(--green)}
  @media (max-width:640px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* ---- がい数のはんい：最初から考える ---- */
  .scbox{width:100%;display:flex;flex-direction:column;align-items:center;--rslot:calc(var(--cell) * .46)}
  .scgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
          grid-template-rows:28px auto 26px 4px 28px 26px auto 28px;
          width:100%;max-width:640px;margin-top:clamp(10px,3.6vh,38px);justify-items:center;align-items:center}
  .scaxis{grid-column:1 / 6;grid-row:4;width:100%;height:4px;border-radius:2px;background:#C43A78}
  .sctk{width:4px;border-radius:2px;background:#C43A78;align-self:stretch;justify-self:center;
        position:relative;z-index:2}
  .sctk.dn{background:var(--red)}
  .scband{grid-column:2 / 5;grid-row:5;width:100%;align-self:stretch;background:var(--red);opacity:.8;
          position:relative;z-index:1;
          clip-path:polygon(16.667% 0, 83.333% 0, 81% 100%, 16.667% 100%)}
  .scar{font-size:calc(var(--rslot) * 1.05);line-height:1;font-weight:700;color:var(--amber);
        opacity:0;transition:opacity .22s ease;animation:bob .9s ease-in-out infinite}
  .scar.on{opacity:1}
  @keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
  .scfade{animation:scfade .26s ease both}
  @keyframes scfade{from{opacity:0}to{opacity:1}}
  .sctop,.scbot{display:flex;align-items:center;gap:3px;white-space:nowrap}
  .scbot{margin-top:5px;position:relative}
  .fxbox{display:flex;align-items:center;gap:2px}
  .fxs{width:var(--rslot);height:calc(var(--rslot) * 1.5);display:flex;align-items:center;justify-content:center;
       font-size:calc(var(--rslot) * 1.1);font-weight:700;line-height:1}
  .scunit{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:5px;
          font-size:calc(var(--rslot) * .66);font-weight:700;line-height:1.3;color:var(--ink);white-space:nowrap}
  @media (max-width:700px){ .scunit{font-size:calc(var(--rslot) * .55);margin-left:3px} }

  .soon{margin-top:40px;text-align:center;color:var(--pencil);font-size:clamp(13px,3.2vw,18px);line-height:2}
  .soon b{color:var(--blue)}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
    .scar{animation:none !important;transform:none !important}
    .draw{stroke-dashoffset:0 !important}
    .hanamaru{opacity:1 !important}
  }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>がい数の <span>れんしゅう</span></h1>
    <div class="score">せいかい <b id="okN">0</b> / <span id="allN">0</span></div>
  </div>

  <nav class="tabs" role="tablist">

        if(v===N) s += `<rect x="${X-46}" y="${y-62}" width="92" height="34" rx="7" fill="#FBE7A6"/>`;
        s += `<text x="${X}" y="${y-36}" text-anchor="middle" font-size="25" font-weight="700" fill="#1E2A33">${v}</text>`;
      }
    }
    // はんいの帯（数直線に ぴったり つける）
    const a=px(L), b=px(H);
    s += `<polygon points="${a},${y+2} ${b},${y+2} ${b-20},${y+26} ${a},${y+26}" fill="#E0332B" opacity=".78"/>`;
    s += `</svg>`;
    return s;
  }

  function buildRange(){
    const g=$('grid'); g.innerHTML=''; g.style.display='block'; g.style.gridTemplateColumns='';
    document.querySelector('.gridwrap').classList.add('wide');
    const box=document.createElement('div'); box.className='rangebox';
    // けた数が多いときは ますを 小さくして 1行におさめる
    const f = P.len<=3 ? 0.60 : (P.len===4 ? 0.50 : 0.42);
    box.style.setProperty('--rslot', `calc(var(--cell) * ${f})`);
    box.innerHTML = numberLine();

    const makeBox = b => makeSlotBox(b,'paren');

    const isSB = (fmt==='sb');
    const line=document.createElement('div'); line.className = isSB ? 'sbgrid' : 'ansline';
    [0,1].forEach(b=>{
      if(isSB){
        const lab=document.createElement('div'); lab.className='sblab'; lab.textContent=LAB.sb[b];
        line.appendChild(lab); line.appendChild(makeBox(b));
      }else{
        line.appendChild(makeBox(b));
        const lab=document.createElement('div'); lab.className='lab'; lab.textContent=LAB[fmt][b];
        line.appendChild(lab);
      }
    });
    box.appendChild(line);
    g.appendChild(box);
    paintRange();
  }

  // （　）や □ の ます箱を つくる（'paren' か 'frame'）
  function makeSlotBox(b, kind){
    const wrap=document.createElement('div'); wrap.className='abox'+(kind==='frame'?' frame':'');
    wrap.dataset.b=b;
    wrap.onclick=()=>{
      if(step!==3) return;
      if(mode==='range' && rsub==='scratch'){ const [lo,hi]=scLim(); if(b<lo||b>hi) return; }
      rbox=b; paintRange();
    };
    if(kind==='paren'){ const p=document.createElement('span'); p.className='paren'; p.textContent='（'; wrap.appendChild(p); }
    for(let i=0;i<P.rlen[b];i++){
      const c=document.createElement('div'); c.className='rslot'; c.dataset.b=b; c.dataset.i=i;
      wrap.appendChild(c);
    }
    if(kind==='paren'){ const p=document.createElement('span'); p.className='paren'; p.textContent='）'; wrap.appendChild(p); }
    return wrap;
  }

  function paintRange(){
    if(mode==='range' && rsub==='scratch'){ paintScratch(); return; }
    const frame = (mode==='gai') ? ' frame' : '';
    document.querySelectorAll('.abox').forEach((w,b)=>{
      w.className='abox'+frame+(rbox===b&&step===3?' on':'');
    });
    document.querySelectorAll('.rslot').forEach(s=>{
      const b=+s.dataset.b, i=+s.dataset.i, v=rin[b][i]||'';
      s.textContent=v;
      s.className='rslot'+(v?' filled':'')+(step===4?' ok':'')
        +(step===3 && b===rbox && i===rin[b].length ? ' next':'');
    });
  }

  /* ---------- がい数のはんい：カード ---------- */
  function makeCards(){
    const u = [10,100,100,1000][rnd(0,3)];
    const N = u*rnd(2,9);                       // 80 / 800 / 8000 のような きりのよい数
    const low = N-u/2, hi = N+u/2;
    const pName = (u===10?'十':u===100?'百':'千')+'の位';
    // かならず 入れる：はんいの 両はし と そのとなり（いちばん まちがえやすい）
    const dig = String(N).length;                 // カードの けた数を そろえる
    const inN = rnd(3,5), outN = 8-inN;           // 正解の まい数は 毎回 かえる（数えて 当てられないように）
    const inside=[low, hi-1], outside=[hi, low-1];
    let guard=0;
    while(inside.length<inN && guard++<600){
      const v=rnd(low,hi-1); if(!inside.includes(v)) inside.push(v);
    }
    guard=0;
    while(outside.length<outN && guard++<600){
      const v = (Math.random()<0.5) ? rnd(low-u,low-1) : rnd(hi,hi+u-1);
      if(v<1 || String(v).length!==dig) continue;
      if(!outside.includes(v)) outside.push(v);
    }
    const cards=inside.concat(outside);
    if(cards.length!==8) return makeCards();      // まれに そろわない ときは やりなおし
    for(let i=cards.length-1;i>0;i--){ const j=rnd(0,i); const w=cards[i]; cards[i]=cards[j]; cards[j]=w; }
    return {kind:'cards', u, N, low, hi, pName, cards, ans:cards.filter(v=>v>=low&&v<hi)};
  }

  function buildCards(){
    const g=$('grid'); g.innerHTML=''; g.style.display='block'; g.style.gridTemplateColumns='';
    document.querySelector('.gridwrap').classList.add('wide');
    const box=document.createElement('div'); box.className='cardbox';

    const cg=document.createElement('div'); cg.className='cards';
    P.cards.forEach((v,i)=>{
      const b=document.createElement('button');
      b.className='card'+(sel.includes(i)?' on':'');
      b.textContent=v;
      if(step===4){ b.disabled=true; if(v>=P.low && v<P.hi) b.classList.add('hit'); }
      b.onclick=()=>toggleCard(i);
      cg.appendChild(b);
    });
    box.appendChild(cg);

    {
      const nt=document.createElement('div'); nt.className='note calm';
      nt.innerHTML = `四捨五入して ${P.pName}までのがい数にすると <b>${P.N}</b> になるのは、`
        + `<b>${P.low}以上 ${P.hi}未満</b>（${P.low}から ${P.hi-1}まで）の数です。`;
      if(step!==4) nt.style.visibility='hidden';
      box.appendChild(nt);
    }
    g.appendChild(box);
  }

  function toggleCard(i){
    if(step!==3) return;
    const k=sel.indexOf(i);
    if(k>=0) sel.splice(k,1); else sel.push(i);
    buildCards();
  }

  function judgeCards(){
    if(step!==3) return;
    if(sel.length===0){ say('カードを タップして えらんでね。','bad'); return; }
    if(!counted){ counted=true; allN++; }
    const wrong = sel.filter(i=> !(P.cards[i]>=P.low && P.cards[i]<P.hi));
    if(wrong.length){
      sel = sel.filter(i=> wrong.indexOf(i)<0);      // ちがうカードだけ はずす
      buildCards();
      const cs=document.querySelectorAll('.card');
      wrong.forEach(i=>{ const el=cs[i]; if(el){ el.classList.add('ng'); setTimeout(()=>el.classList.remove('ng'),400); } });
      say(`赤くゆれた カードは、四捨五入しても ${P.N}に ならないよ。はずしたから もういちど。`,'bad');
    }else if(sel.length<P.ans.length){
      say(`えらんだ カードは ぜんぶ あっているよ。でも、まだ ほかにも あるね。`,'bad');
    }else{
      okN++; step=4; buildCards(); panel();
      const cs=document.querySelectorAll('.card');
      showHanamaru(cs[cs.length-1], false);
      say(`正解！ ${P.low}から ${P.hi-1}までが ${P.N}に なるよ。${P.hi}は ならないね。`,'good');
    }
    $('okN').textContent=okN; $('allN').textContent=allN;
  }

  /* ---------- がい数のはんい：最初から考える ---------- */
  // s は「もとになる数」。N = s × u（例 u=10, s=12 → 120）
  const SCENES = [
    {u:10,   s:[3,49],  lead:'市内の牧場では、ぶたを 育てています。',       what:'ぶたの体重',   unit:'kg'},
    {u:10,   s:[12,49], lead:'学級文庫の 本を 数えました。',               what:'本の数',       unit:'さつ'},
    {u:10,   s:[12,49], lead:'体育館に いすを ならべました。',             what:'いすの数',     unit:'きゃく'},
    {u:10,   s:[3,49],  lead:'学校の 花だんに 花が さきました。',           what:'花の数',       unit:'本'},
    {u:100,  s:[2,9],   lead:'この 小学校には たくさんの 子どもが います。', what:'児童の数',     unit:'人'},
    {u:100,  s:[12,39], lead:'遠足で 公園まで 歩きました。',               what:'歩いた道のり', unit:'m'},
    {u:100,  s:[2,9],   lead:'町の うらに 小さな 山が あります。',         what:'山の高さ',     unit:'m'},
    {u:1000, s:[2,8],   lead:'この 町に すんでいる 人を 数えました。',      what:'町の人口',     unit:'人'},
    {u:1000, s:[2,8],   lead:'市立図書館の 本を 数えました。',             what:'本の数',       unit:'さつ'},
    {u:1000, s:[2,8],   lead:'日本には 高い 山が あります。',              what:'山の高さ',     unit:'m'}
  ];

  function makeScratch(){
    for(let t=0;t<300;t++){
      const sc = SCENES[rnd(0,SCENES.length-1)];
      const u = sc.u, N = rnd(sc.s[0], sc.s[1]) * u;
      // 両はしの けた数が そろう ものだけ（90 と 110 のような 組は さける）
      if(String(N-u).length !== String(N+u).length) continue;
      const dl = String(N+u).length;
      return {kind:'scratch', phase:0, u, N, low:N-u/2, hi:N+u/2,
              unit:sc.unit, lead:sc.lead, what:sc.what,
              pName:(u===10?'十':u===100?'百':'千')+'の位',
              dlen:dl, rlen:[dl,dl,dl,dl]};
    }
    return makeScratch();
  }

  const scLim = ()=> (P.phase===0) ? [0,1] : [2,3];   // いま 入力できる ますの はんい

  function buildScratch(){
    const g=$('grid'); g.innerHTML=''; g.style.display='block'; g.style.gridTemplateColumns='';
    document.querySelector('.gridwrap').classList.add('wide');
    const box=document.createElement('div'); box.className='scbox';
    const f = P.dlen<=2 ? 0.56 : (P.dlen===3 ? 0.46 : 0.36);
    box.style.setProperty('--rslot', `calc(var(--cell) * ${f})`);

    const gr=document.createElement('div'); gr.className='scgrid';
    const put=(el,col,row)=>{ el.style.gridColumn=String(col); el.style.gridRow=String(row); gr.appendChild(el); return el; };
    const wrapEl=(cls,child)=>{ const d=document.createElement('div'); d.className=cls; d.appendChild(child); return d; };
    const tick=(cls,col,row)=>{ const d=document.createElement('div'); d.className='sctk'+cls; put(d,col,row); };

    const arrow=(b,col,row,ch)=>{ const d=document.createElement('div'); d.className='scar';
      d.dataset.b=b; d.textContent=ch; put(d,col,row); };

    // ── 上のだん：左はし（入力）／まん中（さいしょから入っている）／右はし（入力）
    put(wrapEl('sctop', makeSlotBox(0,'plain')), 1, 2);
    const fx=document.createElement('div'); fx.className='fxbox';
    String(P.N).split('').forEach(ch=>{
      const d=document.createElement('div'); d.className='fxs'; d.textContent=ch; fx.appendChild(d);
    });
    put(wrapEl('sctop', fx), 3, 2);
    put(wrapEl('sctop', makeSlotBox(1,'plain')), 5, 2);
    arrow(0,1,1,'↓'); arrow(1,5,1,'↓');

    // ── めもりと 数直線
    tick('',1,'3');  tick('',3,'3 / 6');  tick('',5,'3');
    const ax=document.createElement('div'); ax.className='scaxis'; gr.appendChild(ax);

    // ── 下のだん：両はしが 入ってから あらわれる
    // 下のだん：場所は さいしょから とっておき、両はしが 入ってから 見せる
    {
      const on = (P.phase>=1);
      const fade = (on && step===3) ? ' scfade' : '';    // あらわれる ときだけ ふわっと
      const hide = el => { if(!on) el.style.visibility='hidden'; };
      const bd=document.createElement('div'); bd.className='scband scfade';
      if(step!==4) bd.style.visibility='hidden';
      gr.appendChild(bd);
      tick(' dn'+fade,2,'5 / 7');  tick(' dn'+fade,4,'5 / 7');
      hide(gr.children[gr.children.length-2]); hide(gr.children[gr.children.length-1]);
      arrow(2,2,8,'↑'); arrow(3,4,8,'↑');
      [[2,'以上'],[3,'未満']].forEach(([b,word])=>{
        const w=document.createElement('div'); w.className='scbot'+fade;
        w.appendChild(makeSlotBox(b,'plain'));
        if(step===4){                                   // こたえが 出てから つける
          const u=document.createElement('span'); u.className='scunit scfade';
          u.textContent = P.unit + word;
          w.appendChild(u);
        }
        hide(w);
        put(w, b===2?2:4, 7);
      });
    }
    box.appendChild(gr);

    {
      const nt=document.createElement('div'); nt.className='note calm';
      nt.innerHTML = `四捨五入して ${P.pName}までのがい数にすると <b>${P.N}</b> になるのは、`
        + `<b>${P.low}以上 ${P.hi}未満</b>（${P.low}から ${P.hi-1}まで）の数です。`;
      if(step!==4) nt.style.visibility='hidden';
      box.appendChild(nt);
    }

    g.appendChild(box);
    paintScratch();
  }

  function paintScratch(){
    document.querySelectorAll('.scar').forEach(a=>{
      a.classList.toggle('on', step===3 && +a.dataset.b===rbox);
    });
    document.querySelectorAll('.abox').forEach(w=>{
      const b=+w.dataset.b;
      w.className='abox'+(rbox===b&&step===3?' on':''); w.dataset.b=b;
    });
    document.querySelectorAll('.rslot').forEach(s=>{
      const b=+s.dataset.b, i=+s.dataset.i, v=rin[b][i]||'';
      s.textContent=v;
      const done = (b<2) ? (P.phase>=1) : (step===4);   // すんだ ますは 緑に
      s.className='rslot'+(v?' filled':'')+(done?' ok':'')
        +(step===3 && b===rbox && i===rin[b].length ? ' next':'');
    });
  }

  function judgeScratch(){
    if(!counted){ counted=true; allN++; }
    const [b0,b1] = scLim();
    const want = (P.phase===0) ? [P.N-P.u, P.N+P.u] : [P.low, P.hi];
    const ok = want.every((v,k)=> Number(rin[b0+k])===v);

    if(ok && P.phase===0){
      P.phase=1; locked=false; rbox=2;
      buildScratch(); panel();
      say(`そうだね！ つぎは、${P.N-P.u}と${P.N}の まん中、${P.N}と${P.N+P.u}の まん中の 数だよ。`,'tip');
    }else if(ok){
      okN++; step=4; buildScratch(); panel();
      const boxes=document.querySelectorAll('.abox');
      showHanamaru(boxes[boxes.length-1], false);
      say(`正解！ ${P.low}${P.unit}以上 ${P.hi}${P.unit}未満だね。`
        + `${P.low}から ${P.hi-1}までが、四捨五入すると ${P.N}に なるよ。`,'good');
    }else{
      locked=false;
      want.forEach((v,k)=>{ if(Number(rin[b0+k])!==v) rin[b0+k]=''; });
      const k=nextEmpty(); rbox = (k>=0?k:b0);
      paintScratch();
      document.querySelectorAll('.rslot').forEach(el=>{
        const b=+el.dataset.b;
        if(b>=b0 && b<=b1 && !rin[b]){ el.classList.add('ng'); setTimeout(()=>el.classList.remove('ng'),400); }
      });
      say(P.phase===0
        ? `${P.pName}までの がい数だから、めもりは ${P.u}ずつ すすむよ。まん中の ${P.N}の 左と右は いくつかな？`
        : `ちょうど まん中の 数だよ。${P.u/2}だけ すすんだ ところは いくつかな？`,'bad');
    }
    $('okN').textContent=okN; $('allN').textContent=allN;
  }

  /* ---------- 約何万 ---------- */
  function makeAbout(){
    const k=rnd(1,9), lo=k*10000, hi=lo+10000, mid=lo+5000;
    let N;
    do{ N = rnd(lo+1000, hi-1000); }while(N%1000===0 || N===mid);
    return {kind:'about', lo, hi, mid, N, ans:(N<mid?lo:hi)};
  }

  function buildAbout(){
    const g=$('grid'); g.innerHTML=''; g.style.display='block'; g.style.gridTemplateColumns='';
    document.querySelector('.gridwrap').classList.add('wide');
    const box=document.createElement('div'); box.className='aboutbox';

    const x0=100, x1=560, y=118;
    const px = v => x0 + (v-P.lo)/(P.hi-P.lo)*(x1-x0);
    const X = px(P.N), bx = Math.max(92, Math.min(X, 568));
    let s2 = `<svg class="abtline" viewBox="0 0 660 134" preserveAspectRatio="xMidYMid meet">`;
    // もとの数（黄色い箱）と やじるし
    s2 += `<rect x="${bx-84}" y="6" width="168" height="50" rx="10" fill="#FBE7A6" stroke="#E08A3C" stroke-width="3"/>`;
    s2 += `<text x="${bx}" y="44" text-anchor="middle" font-size="34" font-weight="700" fill="#1E2A33">${P.N}</text>`;
    s2 += `<path d="M${bx} 56 L${X} 112" stroke="#E0703C" stroke-width="3" fill="none"/>`;
    s2 += `<path d="M${X-7} 104 L${X} 116 L${X+7} 104" fill="none" stroke="#E0703C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    // 数直線（めもりは 線の上）
    s2 += `<line x1="${x0-16}" y1="${y}" x2="${x1+16}" y2="${y}" stroke="#C43A78" stroke-width="4" stroke-linecap="round"/>`;
    for(let i=0;i<=10;i++){
      const t=x0+i*(x1-x0)/10, big=(i===0||i===5||i===10);
      s2 += `<line x1="${t}" y1="${y}" x2="${t}" y2="${y-(big?20:11)}" stroke="#C43A78" stroke-width="${big?3.5:2}"/>`;
    }
    // 両はしの数（線の上）
    s2 += `<text x="${x0}" y="${y-28}" text-anchor="middle" font-size="26" font-weight="700" fill="#1E2A33">${P.lo}</text>`;
    s2 += `<text x="${x1}" y="${y-28}" text-anchor="middle" font-size="26" font-weight="700" fill="#1E2A33">${P.hi}</text>`;
    s2 += `</svg>`;
    box.innerHTML = s2;

    const ch=document.createElement('div'); ch.className='choices';
    [P.lo,P.hi].forEach(v=>{
      const b=document.createElement('button'); b.className='choice'; b.textContent=v;
      if(step===4){ b.disabled=true; if(v===P.ans) b.classList.add('pick'); }
      b.onclick=()=>pickAbout(v,b);
      ch.appendChild(b);
    });
    box.appendChild(ch);
    g.appendChild(box);
  }

  function pickAbout(v, el){
    if(step!==3) return;
    if(!counted){ counted=true; allN++; }
    if(v===P.ans){
      okN++; step=4; buildAbout(); panel();
      showHanamaru(document.querySelectorAll('.choice')[P.ans===P.lo?0:1], false);
      const man = P.ans/10000;
      say(`正解！ ${P.N} は ${P.mid} より ${P.N<P.mid?'小さい':'大きい'}から、約 ${P.ans}（${man}万）だね。`,'good');
    }else{
      el.classList.add('ngc'); setTimeout(()=>el.classList.remove('ngc'),400);
      say(`まん中の ${P.mid} と くらべてみよう。${P.N} は どちらがわ かな？`,'bad');
    }
    $('okN').textContent=okN; $('allN').textContent=allN;
  }

  /* ---------- 応用問題 ---------- */
  const GOODS = ['ふでばこ','けしゴム','ノート','じょうぎ','はさみ','色えんぴつ','下じき','電たく','のり','クレヨン','水とう','ぼうし'];
  function makeApply(){
    const place = 100;                                   // がい算は 百の位まで（暗算できる形に）
    const budget = (Math.random()<0.5) ? 2000 : 3000;    // 手もちのお金
    const kind = (Math.random()<0.68) ? 'enough' : 'over';   // 「たりるか」＝切り上げ を多めに
    const S = budget + [-300,-200,-100,0,100,200][rnd(0,5)];   // こえる場合も こえない場合も
    const n = S/100;
    let a,b,c;
    do{ a=rnd(2,15); b=rnd(2,15); c=n-a-b; }while(c<2||c>15);
    const est=[a*100,b*100,c*100];
    const price = est.map(e => kind==='enough' ? e-rnd(1,99) : e+rnd(1,99));
    const names=[]; while(names.length<3){ const g=GOODS[rnd(0,GOODS.length-1)]; if(!names.includes(g)) names.push(g); }
    return {kind, place, names, price, est, sum:S, budget, placeName:'百の位'};
  }

  function buildApply(){
    const g=$('grid'); g.innerHTML=''; g.style.display='block'; g.style.gridTemplateColumns='';
    document.querySelector('.gridwrap').classList.add('wide');
    const box=document.createElement('div'); box.className='applybox';

    const items=document.createElement('div'); items.className='items';
    P.names.forEach((nm,i)=>{
      const d=document.createElement('div'); d.className='item';
      d.innerHTML=`<div class="nm">${nm}</div><div class="pr">${P.price[i]}円</div>`
        + `<div class="est"${step===4?'':' style="visibility:hidden"'}>↓<br>${P.est[i]}円</div>`;
      items.appendChild(d);
    });
    box.appendChild(items);

    const lead=document.createElement('div'); lead.className='lead';
    lead.textContent='つぎのような式で、代金の合計の 見当を つけました。';
    box.appendChild(lead);

    const f=document.createElement('div'); f.className='formula';
    f.textContent=`${P.est[0]}＋${P.est[1]}＋${P.est[2]}＝${P.sum}`;
    box.appendChild(f);

    const b0 = pick[0] ? (pick[0]==='up'?'切り上げて':'切り捨てて') : '？';
    const b1 = pick[1] ? (pick[1]===100?'百の位':pick[1]===10?'十の位':'一の位') : '？';
    const st = (step===4) ? ' ok' : '';
    const sent=document.createElement('div'); sent.className='sent';
    sent.innerHTML = `代金の合計を <b>${P.kind==='enough'?'多め':'少なめ'}</b>に 見積もるために、どのねだんも `
      + `<span class="blank${pick[0]?st:' empty'}">${b0}</span>、`
      + `<span class="blank${pick[1]?st:' empty'}">${b1}</span>までのがい数にしてから 計算しています。`;
    box.appendChild(sent);

    const picks=document.createElement('div'); picks.className='picks';
    const row1=document.createElement('div'); row1.className='prow';
    [['up','切り上げて'],['down','切り捨てて']].forEach(([v,lb])=>{
      const b=document.createElement('button'); b.className='pbtn'+(pick[0]===v?' on':''); b.textContent=lb;
      b.disabled=(step===4); b.onclick=()=>pickApply(0,v); row1.appendChild(b);
    });
    const row2=document.createElement('div'); row2.className='prow';
    [[100,'百の位'],[10,'十の位'],[1,'一の位']].forEach(([v,lb])=>{
      const b=document.createElement('button'); b.className='pbtn'+(pick[1]===v?' on':''); b.textContent=lb;
      b.disabled=(step===4); b.onclick=()=>pickApply(1,v); row2.appendChild(b);
    });
    picks.append(row1,row2);
    box.appendChild(picks);

    // 正解したら「四捨五入とは ちがう」ことを 具体れいで 見せる（場所は さいしょから あけておく）
    {
      const R = v => Math.floor(v/100 + 0.5)*100;                 // 百の位までの四捨五入
      const k = P.price.findIndex((p,i)=> R(p)!==P.est[i]);       // 四捨五入と ちがう ねだんを さがす
      const nt=document.createElement('div'); nt.className='note';
      if(k>=0){
        nt.innerHTML = `<b>※ 四捨五入とは ちがうよ。</b><br>`
          + `${P.price[k]}円を 四捨五入すると ${R(P.price[k])}円。`
          + `でも ここでは、${P.kind==='enough'?'<b>たりるか</b>を しらべるので <b>多めに</b>':'<b>こえるか</b>を しらべるので <b>少なめに</b>'} 見て、`
          + `${P.est[k]}円と します。`;
      }else{
        nt.innerHTML = `<b>※ 四捨五入とは ちがうよ。</b><br>`
          + (P.kind==='enough'
              ? `<b>たりるか</b>を しらべるときは、数字が いくつでも どのねだんも <b>切り上げて</b> 多めに 見ます。`
              : `<b>こえるか</b>を しらべるときは、数字が いくつでも どのねだんも <b>切り捨てて</b> 少なめに 見ます。`);
      }
      if(step!==4) nt.style.visibility='hidden';
      box.appendChild(nt);
    }

    g.appendChild(box);
  }

  function pickApply(i,v){
    if(step!==3) return;
    pick[i]=v; buildApply();
    if(pick[0] && pick[1]) setTimeout(judgeApply,300);
  }

  function judgeApply(){
    const wantOp = (P.kind==='enough') ? 'up' : 'down';
    if(!counted){ counted=true; allN++; }
    if(pick[0]===wantOp && pick[1]===P.place){
      okN++; step=4; buildApply(); panel();
      showHanamaru(document.querySelector('.sent'), false);
      let m;
      if(P.kind==='enough'){
        m = (P.sum<=P.budget)
          ? `正解！ 百の位まで 切り上げて 見積もると ${P.sum}円。じっさいの代金は それより 少ないから、${P.budget}円で たりるね。`
          : `正解！ 百の位まで 切り上げて 見積もると ${P.sum}円で、${P.budget}円を こえたね。これだけでは たりると いえないから、たしかめが いるよ。`;
      }else{
        m = (P.sum>=P.budget)
          ? `正解！ 百の位まで 切り捨てて 見積もると ${P.sum}円。じっさいの代金は それより 多いから、${P.budget}円は こえるね。`
          : `正解！ 百の位まで 切り捨てて 見積もると ${P.sum}円で、${P.budget}円に とどかないね。こえるとは いえないから、たしかめが いるよ。`;
      }
      say(m,'good');
    }else{
      if(pick[0]!==wantOp) pick[0]=null;
      if(pick[1]!==P.place) pick[1]=null;
      buildApply();
      document.querySelectorAll('.blank').forEach(el=>{ el.classList.add('ng'); setTimeout(()=>el.classList.remove('ng'),400); });
      say('式の数を よく見よう。もとのねだんより 大きく なっている？ 小さく なっている？ どの位で そろえている？','bad');
    }
    $('okN').textContent=okN; $('allN').textContent=allN;
  }

  /* ---------- がい算 ---------- */
  function makeGai(){
    if(gsub==='place'){
      const keep = Math.random()<0.5 ? 100 : 1000;
      const op = Math.random()<0.5 ? '＋' : '－';
      const R = v => Math.floor(v/keep + 0.5)*keep;
      for(let t=0;t<300;t++){
        let a = (keep===100) ? rnd(120,980) : rnd(1200,9800);
        let b = (keep===100) ? rnd(120,980) : rnd(1200,9800);
        if(op==='－' && a<b){ const w=a; a=b; b=w; }
        const ra=R(a), rb=R(b);
        if(a===ra || b===rb) continue;            // 四捨五入する意味がある数に
        if(op==='－' && ra<=rb) continue;
        const ans = (op==='＋') ? ra+rb : ra-rb;
        return {kind:'gai', sub:'place', a,b,op,ra,rb,ans,
                keepName:(keep===100?'百':'千')+'の位',
                roundName:(keep===100?'十':'百')+'の位',
                rlen:[String(ra).length,String(rb).length,String(ans).length]};
      }
    }
    // 上から１けた（×・÷）
    const op = Math.random()<0.5 ? '×' : '÷';
    const R1 = v => { const k=String(v).length-1, u=Math.pow(10,k); return Math.floor(v/u + 0.5)*u; };
    for(let t=0;t<300;t++){
      if(op==='×'){
        const ra=rnd(2,9)*100, rb=rnd(2,9)*100;
        const a=rnd(ra-50,ra+49), b=rnd(rb-50,rb+49);
        if(a===ra||b===rb||R1(a)!==ra||R1(b)!==rb) continue;
        const ans=ra*rb;
        return {kind:'gai', sub:'top', a,b,op,ra,rb,ans,
                rlen:[String(ra).length,String(rb).length,String(ans).length]};
      }else{
        const d1=rnd(2,9), q=rnd(2,4), n1=d1*q;
        if(n1>9) continue;
        const ra=n1*1000, rb=d1*10;
        const a=rnd(ra-500,ra+499), b=rnd(rb-5,rb+4);
        if(a===ra||b===rb||R1(a)!==ra||R1(b)!==rb) continue;
        const ans=ra/rb;
        return {kind:'gai', sub:'top', a,b,op,ra,rb,ans,
                rlen:[String(ra).length,String(rb).length,String(ans).length]};
      }
    }
    return makeGai();
  }

  function buildGai(){
    const g=$('grid'); g.innerHTML=''; g.style.display='block'; g.style.gridTemplateColumns='';
    document.querySelector('.gridwrap').classList.add('wide');
    const box=document.createElement('div'); box.className='gaibox';
    const total = P.rlen.reduce((x,y)=>x+y,0);
    const f = Math.min(0.52, 5.6/total);   // ますの数に合わせて はみ出さない大きさに
    box.style.setProperty('--rslot', `calc(var(--cell) * ${f})`);

    const cell=(txt,cls)=>{ const d=document.createElement('div'); d.className=cls||''; d.textContent=txt; return d; };
    const down=()=>{ const d=document.createElement('div'); d.className='gdown';
      d.innerHTML='<svg viewBox="0 0 26 38"><path d="M13 2 L13 26" stroke="#1E2A33" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
                  '<path d="M6 20 L13 30 L20 20" stroke="#1E2A33" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      return d; };

    const gr=document.createElement('div'); gr.className='gaigrid';
    // 1だんめ：もとの式
    gr.append(cell(P.a,'gnum'), cell(P.op,'gop'), cell(P.b,'gnum'), cell('',''), cell('',''));
    // 2だんめ：やじるし
    gr.append(down(), cell('',''), down(), cell('',''), cell('',''));
    // 3だんめ：がい算の式
    gr.append(makeSlotBox(0,'frame'), cell(P.op,'gop'), makeSlotBox(1,'frame'), cell('＝','gop'), makeSlotBox(2,'frame'));
    box.appendChild(gr);
    g.appendChild(box);
    paintRange();
  }

  function questionText(){
    if(mode==='apply') return (P.kind==='enough')
      ? `<em>${P.budget}円</em>を もっています。つぎの３つのものを買うのに <em>たりるか</em>どうかを考えます。`
      : `<em>${P.budget}円以上</em>買うと くじが 引けます。つぎの３つのものの代金の合計が <em>${P.budget}円をこえるか</em>どうかを考えます。`;
    if(mode==='about') return `つぎの数は、<em>約何万</em>と いえますか。`;
    if(mode==='round') return `<em>${placeOf(P.L,P.target)}の位</em>の数字を四捨五入して、がい数で表しましょう。`;
    if(mode==='man')   return `<em>${P.keepName}まで</em>のがい数にしましょう。`;
    if(mode==='top2')  return `<em>上から${P.keepN}けた</em>のがい数にしましょう。`;
    if(mode==='range'){
      if(rsub==='card') return `四捨五入して <em>${P.pName}まで</em>のがい数にすると <em>${P.N}</em> になる数を、<em>ぜんぶ</em>えらびましょう。`;
      if(rsub==='scratch') return `${P.lead}${P.what}は、四捨五入して <em>${P.pName}まで</em>のがい数にすると <em>${P.N}${P.unit}</em>に なります。`
        + `<small>${P.what}は、何${P.unit}から 何${P.unit}の 間に あるでしょうか。数直線を つくって 考えましょう。</small>`;
      return `四捨五入して、<em>${P.pName}まで</em>のがい数にすると <em>${P.N}</em> になる整数のはんいを書きましょう。`;
    }
    if(P.sub==='place') return `四捨五入して<em>${P.keepName}まで</em>のがい数にして、答えを見積もりましょう。<small>（${P.roundName}で四捨五入します。）</small>`;
    return `四捨五入して<em>上から１けた</em>のがい数にして、${P.op==='×'?'積':'商'}を見積もりましょう。<small>（上から２けためで四捨五入します。）</small>`;
  }

  function answerValue(){
    const unit = Math.pow(10, P.L - P.target);
    return op==='up' ? (Math.floor(P.num/unit)+1)*unit : Math.floor(P.num/unit)*unit;
  }

  /* ---------- ばん面をつくる（step が かわった時だけ） ---------- */
  function buildBoard(){
    if(mode==='about'){ buildAbout(); return; }
    if(mode==='apply'){ buildApply(); return; }
    if(mode==='range'){
      if(rsub==='card'){ buildCards(); return; }
      if(rsub==='scratch'){ buildScratch(); return; }
      buildRange(); return;
    }
    if(mode==='gai'){ buildGai(); return; }
    const g=$('grid'); g.innerHTML=''; ansCells=[]; g.style.display='grid';
    document.querySelector('.gridwrap').classList.remove('wide');
    g.style.gridTemplateColumns = `repeat(${P.L}, var(--cell))`;

    P.d.forEach((_,i)=>{
      const e=document.createElement('div'); e.className='lbl'; e.textContent=placeOf(P.L,i); g.appendChild(e);
    });

    P.d.forEach((_,i)=>{
      const e=document.createElement('div'); e.className='top';
      if(step>=3){
        let ch='', delay=0;
        if(i>=P.target){ ch='0'; delay=0.38+(i-P.target)*0.10; }
        else if(op==='up' && i===P.target-1){ ch='1'; delay=0.28; }
        if(ch){
          const s=document.createElement('span'); s.textContent=ch;
          s.style.animationDelay=(reduce?0:delay)+'s';
          e.appendChild(s);
        }
      }
      g.appendChild(e);
    });

    P.d.forEach((v,i)=>{
      const e=document.createElement('div');
      const tapable = (step===0 || step===1);
      e.className='dg'+(tapable?' tapable':'');
      e.textContent=v;
      if(step===0) e.addEventListener('click',()=>tapBoundary(i,e));
      else if(step===1) e.addEventListener('click',()=>tapDigit(i,e));
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 60 75');
      if(step>=2 && i===P.target){
        const p=document.createElementNS('http://www.w3.org/2000/svg','path');
        // 正円（半径31・中心 30,37.5）／下から 時計まわり に かく
        p.setAttribute('d','M30 68.5 C12.9 68.5, -1 54.6, -1 37.5 C-1 20.4, 12.9 6.5, 30 6.5 C47.1 6.5, 61 20.4, 61 37.5 C61 54.6, 48 68.3, 32.2 67.9');
        p.setAttribute('class','pen draw'); p.style.setProperty('--len','212');
        svg.appendChild(p);
      }
      // 四捨五入する位から下だけに斜線（くり上げる左どなりの数字は消さない）
      if(step>=3 && i>=P.target){
        const l=document.createElementNS('http://www.w3.org/2000/svg','path');
        l.setAttribute('d','M6 7 L54 69'); l.setAttribute('class','slash draw');
        l.style.setProperty('--len','80');
        l.style.animationDelay=(reduce?0:(i-P.target)*0.10)+'s';
        svg.appendChild(l);
      }
      e.appendChild(svg); g.appendChild(e);
    });

    // 「の」の行（「一万の位までの」「上から２けたの」だけ）
    for(let i=0;i<P.L;i++){
      const e=document.createElement('div'); e.className='norow';
      if(mode!=='round' && step>=1 && i===P.target-1){
        const s=document.createElement('span'); s.textContent='の';
        if(noShown) s.style.animation='none';   // ２回目からは動かさない
        noShown = true;
        e.appendChild(s);
      }
      g.appendChild(e);
    }

    if(step>=3){
      for(let i=0;i<P.L;i++){
        const e=document.createElement('div'); e.className='arrowcell';
        if(i===P.target){
          e.innerHTML='<svg viewBox="0 0 60 52">'+
            '<path class="arrow draw" style="--len:42" d="M30 3 L30 39"/>'+
            '<path class="arrow draw" style="--len:34;animation-delay:.35s" d="M21 31 L30 42 L39 31"/>'+
            '</svg>';
        }
        g.appendChild(e);
      }
      for(let i=0;i<P.L;i++){
        const e=document.createElement('div'); e.className='ans';
        g.appendChild(e); ansCells.push(e);
      }
      paintAnswer();
    }
  }

  /* ---------- こたえのますだけ ぬりかえる（点滅させない） ---------- */
  function paintAnswer(){
    ansCells.forEach((c,i)=>{
      c.textContent = input[i] || '';
      c.className = 'ans'
        + (i<input.length ? ' filled' : '')
        + (i===input.length && step===3 && !locked ? ' cur' : '')
        + (step===4 ? ' ok' : '');
    });
  }

  function showHanamaru(anchor, advance){
    const wrap = document.querySelector('.gridwrap');
    wrap.querySelectorAll('.hanamaru').forEach(e=>e.remove());   // まえの はなまるが のこらないように
    const last = anchor || ansCells[ansCells.length-1];
    const img = document.createElement('img');
    img.className='hanamaru'; img.src=HANAMARU; img.alt='はなまる';
    wrap.appendChild(img);
    const wr = wrap.getBoundingClientRect(), lr = last.getBoundingClientRect();
    const fw = (img.getBoundingClientRect().width || 90) / fitK;   // ちぢめている ぶんを もどす
    img.style.left = Math.max(0, Math.min((lr.right - wr.left)/fitK + 6, wrap.clientWidth - fw - 2)) + 'px';
    img.style.top  = (lr.top - wr.top - lr.height*0.28)/fitK + 'px';
    try{
      if(!sound) sound = new Audio(PINPON);
      sound.currentTime = 0; sound.play().catch(()=>{});
    }catch(e){}

    // 2びょう見せて、フェードアウト
    clearTimeout(autoTimer);
    autoTimer = setTimeout(()=>{
      img.classList.add('fade');
      autoTimer = setTimeout(()=>{ advance ? newQ() : img.remove(); }, 450);
    }, 2000);
  }

  /* ---------- そうさ ---------- */
  function tapBoundary(i,el){
    if(step!==0) return;
    if(i===P.target-1){
      step=1; buildBoard(); panel();
      say('ここまでの がい数だね。「の」の つぎの 数字を四捨五入しよう。','tip');
    }else{
      el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400);
      say(mode==='man'
        ? `${P.keepName}は どこかな？ 上に書いてある 位の名前 を見てみよう。`
        : `上から かぞえて ${P.keepN}つめ の数字だよ。`, 'bad');
    }
  }

  function tapDigit(i,el){
    if(step!==1) return;
    if(i===P.target){ step=2; buildBoard(); panel(); say('この数字を四捨五入するよ。切り上げ？ 切り捨て？','tip'); }
    else{
      el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400);
      let hint;
      if(mode==='round') hint=`そこは ${placeOf(P.L,i)}の位 だよ。四捨五入するのは ${placeOf(P.L,P.target)}の位。`;
      else hint='四捨五入するのは、「の」を書いた 数字の すぐ 右どなり だよ。';
      say(hint,'bad');
    }
  }

  function chooseOp(o){
    const correct = P.d[P.target]>=5 ? 'up' : 'down';
    if(o!==correct){
      say('もういちど。０〜４ は 切り捨て、５〜９ は 切り上げ だよ。','bad');
      $('ruleBox').classList.add('show'); return;
    }
    op=o; step=3; input=''; locked=false; buildBoard(); panel();
    say(o==='up' ? '切り上げ！ 下の位を ０ にして、ひとつ上の位に １ くり上げるよ。'
                 : '切り捨て！ 下の位を ぜんぶ ０ にするよ。','tip');
  }

  const slotMode = ()=> (mode==='range' || mode==='gai');
  // テンキーが つかえる ばめんか（カード／じゅんび中 は つかわない）
  const padOn = ()=> step===3 && mode!=='about' && mode!=='apply' && !(mode==='range' && rsub==='card');
  const nextEmpty = ()=>{
    const [lo,hi] = (mode==='range' && rsub==='scratch') ? scLim() : [0, P.rlen.length-1];
    for(let i=lo;i<=hi;i++){ if((rin[i]||'').length < P.rlen[i]) return i; }
    return -1;
  };

  function press(n){
    if(!padOn() || locked) return;
    if(slotMode()){
      if(rin[rbox].length>=P.rlen[rbox]) return;
      rin[rbox]+=String(n); paintRange();
      if(rin[rbox].length===P.rlen[rbox]){
        const k=nextEmpty();
        if(k>=0){ rbox=k; paintRange(); }
        else { locked=true; setTimeout(judge,320); }
      }
      return;
    }
    if(input.length>=P.L) return;
    input += String(n); paintAnswer();
    if(input.length===P.L){ locked=true; setTimeout(judge, 320); }
  }
  function back(){
    if(!padOn()||locked) return;
    if(slotMode()){
      const lo = (mode==='range' && rsub==='scratch') ? scLim()[0] : 0;
      if(rin[rbox]==='' && rbox>lo) rbox--;
      rin[rbox]=rin[rbox].slice(0,-1); paintRange(); return;
    }
    input=input.slice(0,-1); paintAnswer();
  }
  function clearAll(){
    if(!padOn()||locked) return;
    if(mode==='range' && rsub==='scratch'){
      const [lo,hi]=scLim();
      for(let i=lo;i<=hi;i++) rin[i]='';
      rbox=lo; paintScratch(); return;
    }
    if(slotMode()){ rin=rin.map(()=>''); rbox=0; paintRange(); return; }
    input=''; paintAnswer();
  }

  function judge(){
    if(slotMode()){ judgeSlots(); return; }
    const ans=answerValue();
    if(!counted){ counted=true; allN++; }
    if(Number(input)===ans){
      okN++; step=4; paintAnswer(); panel(); showHanamaru(null, true);
      say(`正解！ ${P.num} は ${ans} だね。`,'good');
    }else{
      locked=false;
      paintAnswer();
      ansCells.forEach(c=>{ c.classList.add('ng'); setTimeout(()=>c.classList.remove('ng'),400); });
      say('ちがうみたい。上の段の ０ を見て、なおしてみよう。','bad');
    }
    $('okN').textContent=okN; $('allN').textContent=allN;
  }

  function judgeSlots(){
    if(mode==='range' && rsub==='scratch'){ judgeScratch(); return; }
    const w = (mode==='range') ? expected() : [P.ra,P.rb,P.ans];
    if(!counted){ counted=true; allN++; }
    const okAll = w.every((v,i)=> Number(rin[i])===v);
    if(okAll){
      okN++; step=4;
      (mode==='range') ? buildRange() : buildGai();
      panel();
      const boxes=document.querySelectorAll('.abox');
      showHanamaru(boxes[boxes.length-1], false);
      say(mode==='range'
        ? `正解！ ${P.low} から ${P.hi-1} までが ${P.N} になるよ。${P.hi} は入らないね。`
        : `正解！ ${P.a}を${P.ra}、${P.b}を${P.rb}とみて、${P.ra}${P.op}${P.rb}＝${P.ans} と見積もれるね。`,'good');
    }else{
      locked=false;
      // まちがえた ますだけ 消す
      w.forEach((v,i)=>{ if(Number(rin[i])!==v) rin[i]=''; });
      const k=nextEmpty(); rbox = (k>=0?k:0);
      paintRange();
      document.querySelectorAll('.rslot').forEach(el=>{
        if(rin[+el.dataset.b]) return;                 // あっている ますは ゆらさない
        el.classList.add('ng'); setTimeout(()=>el.classList.remove('ng'),400);
      });
      say(mode==='range'
        ? `数直線を見てみよう。${P.N} になるのは、${P.N}から 左右に ${P.u/2} ずつ の あいだだよ。`
        : 'あっている ところは のこしたよ。あいている ますを 考えなおそう。','bad');
    }
    $('okN').textContent=okN; $('allN').textContent=allN;
  }

  /* ---------- 右パネル ---------- */
  function stepChips(){
    const w=$('steps'); w.innerHTML=''; w.classList.remove('col');
    if(mode==='about'||mode==='apply') return;
    if(mode==='gai'){
      [['place','◯の位までの'],['top','上から◯けたの']].forEach(([k,label])=>{
        const b=document.createElement('button');
        b.className='fmt'+(gsub===k?' on':''); b.textContent=label;
        b.onclick=()=>{ if(gsub!==k){ gsub=k; fitMin=1; newQ(); } };
        w.appendChild(b);
      });
      return;
    }
    if(mode==='range'){
      w.classList.add('col');
      // 1だんめ：小タブ
      const r1=document.createElement('div'); r1.className='chiprow';
      [['line','数直線'],['card','カード'],['scratch','最初から考える']].forEach(([k,label])=>{
        const b=document.createElement('button');
        b.className='sub'+(rsub===k?' on':''); b.textContent=label;
        b.onclick=()=>{ if(rsub!==k){ rsub=k; fitMin=1; newQ(); } };
        r1.appendChild(b);
      });
      w.appendChild(r1);
      // 2だんめ：答え方（「数直線」のときだけ）
      if(rsub==='line'){
        const r2=document.createElement('div'); r2.className='chiprow';
        [['miman','以上・未満'],['ika','以上・以下'],['sb','小さい数・大きい数']].forEach(([k,label])=>{
          const b=document.createElement('button');
          b.className='fmt'+(fmt===k?' on':''); b.textContent=label;
          if(step===4) b.disabled=true;
          b.onclick=()=>{ if(fmt!==k && step===3){ fmt=k; rin=['','']; rbox=0; locked=false; fitMin=1;
            buildRange(); stepChips(); say('答え方を かえたよ。','tip'); } };
          r2.appendChild(b);
        });
        w.appendChild(r2);
      }
      return;
    }
    const list = (mode==='round')
      ? [[1,'① 四捨五入する数字をタップ'],[2,'② 切り上げ・切り捨て'],[3,'③ こたえを入力']]
      : [[0, mode==='man' ? `① ${P.keepName}の数字をタップ` : `① 上から${P.keepN}けための数字をタップ`],
         [1,'② 四捨五入する数字をタップ'],[2,'③ 切り上げ・切り捨て'],[3,'④ こたえを入力']];
    list.forEach(([s,label])=>{
      const d=document.createElement('div');
      d.className='stp'+(step===s?' on':(step>s?' done':''));
      d.textContent=label; w.appendChild(d);
    });
  }

  function panel(){
    const c=$('panel'); c.innerHTML='';
    stepChips();

    // せつめい
    const cap=document.createElement('div'); cap.className='cap';
    if(step===0) cap.textContent = `まず、${boundaryLabel()}を タップしてね。下に「の」が入るよ。`;
    else if(step===1) cap.textContent = (mode==='round')
      ? 'まず、四捨五入する けた の数字を タップしてね。'
      : 'つぎに、「の」の 右どなり の数字を タップ。そこを四捨五入するよ。';
    else if(step===2) cap.textContent = 'どちらかな？';
    else if(step===3){
      if(mode==='range') cap.innerHTML = (rsub==='card')
          ? `${P.N}に なる カードを ぜんぶ タップ。おわったら「けってい」。`
          : (rsub==='scratch') ? (P.phase===0
              ? '数直線の <b>左と右の はし</b>の 数を 入力しよう。'
              : 'あらわれた めもりの 数を 入力しよう。')
          : '（　）を えらんで 入力しよう';
      else if(mode==='gai')   cap.innerHTML = '□を えらんで 入力しよう';
      else if(mode==='about') cap.innerHTML = 'どちらに 近いかな？ 下の ボタンで えらぼう。';
      else if(mode==='apply') cap.innerHTML = '下の ボタンから ことばを えらぼう。<br>四捨五入とは ちがう 考え方だよ。';
      else cap.innerHTML = 'こたえを 入力しよう';
    }
    else { cap.textContent = (mode==='range'||mode==='gai') ? 'よくできました！ せつめいを 読んでね。' : 'よくできました！';
           cap.style.color='var(--green)'; cap.style.fontWeight='700'; }
    c.appendChild(cap);

    // ボタンは 場面が かわっても 消さず、うすくして のこす（枠の高さを 変えないため）
    if(mode==='round'||mode==='man'||mode==='top2'){
      const b1=document.createElement('button'); b1.className='big up'; b1.textContent='切り上げ';
      const b2=document.createElement('button'); b2.className='big down'; b2.textContent='切り捨て';
      b1.onclick=()=>chooseOp('up'); b2.onclick=()=>chooseOp('down');
      b1.disabled=b2.disabled=(step!==2);
      c.append(b1,b2);
    }

    if(mode==='range' && rsub==='card'){
      const b=document.createElement('button'); b.className='big up'; b.textContent='これで けってい';
      b.onclick=judgeCards; b.disabled=(step!==3); c.appendChild(b);
    }

    // テンキーは いつも 出しておく（入力する ばめん 以外は おせない）
    if(mode!=='about' && mode!=='apply'){
    const pad=document.createElement('div'); pad.className='pad';
    const mk=(cls,label,fn)=>{
      const b=document.createElement('button'); b.className=cls; b.textContent=label;
      b.onclick=fn; b.disabled=!padOn(); return b;
    };
    [1,2,3,4,5,6,7,8,9].forEach(n=> pad.appendChild(mk('key',n,()=>press(n))));
    pad.appendChild(mk('key sub','１つけす',back));
    pad.appendChild(mk('key','0',()=>press(0)));
    pad.appendChild(mk('key sub','ぜんぶけす',clearAll));
    c.appendChild(pad);
    }

    const nb=document.createElement('button'); nb.className='big nextbtn';
    nb.textContent='次の問題 →'; nb.onclick=newQ;
    c.appendChild(nb);
    fitScreen();
  }

  /* ---------- 1画面に おさめる（スクロールしないで すむように） ---------- */
  let fitK = 1, fitMin = 1;
  function fitScreen(){
    const app=document.querySelector('.app');
    app.style.transform='none';
    const cs=getComputedStyle(document.body);
    const need = app.scrollHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const have = window.innerHeight;
    let k = (need > have + 1) ? Math.max(0.5, have/need) : 1;
    if(k > fitMin) k = fitMin; else fitMin = k;   // 大きい ほうへは もどさない
    fitK = k;
    if(k < 1){
      app.style.transformOrigin='top center';
      app.style.transform='scale('+k+')';
      document.body.style.height=have+'px';
      document.body.style.overflow='hidden';
    }else{
      document.body.style.height=''; document.body.style.overflow='';
    }
  }
  const refit = ()=>{ fitMin=1; fitScreen(); };
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', ()=>setTimeout(refit,250));

  function say(t,cls){ const m=$('msg'); m.textContent=t; m.className='msg '+(cls||''); fitScreen(); }

  function newQ(){
    clearTimeout(autoTimer); autoTimer=null;
    document.querySelectorAll('.hanamaru').forEach(e=>e.remove());
    op=null; input=''; counted=false; locked=false; noShown=false; rin=['','']; rbox=0; sel=[];
    if(mode==='apply'){
      P=makeApply(); step=3; pick=[null,null];
      $('q').innerHTML=questionText();
      buildBoard(); panel();
      say('式を見て、□に あてはまる ことばを えらぼう。','tip');
      $('ruleBox').classList.remove('show');
      return;
    }
    if(mode==='about'){
      P=makeAbout(); step=3;
      $('q').innerHTML=questionText();
      buildBoard(); panel();
      say('数直線を見て、どちらに 近いか えらぼう。','tip');
      $('ruleBox').classList.remove('show');
      return;
    }
    if(mode==='gai'){
      P=makeGai(); step=3; rin=['','','']; rbox=0;
      $('q').innerHTML=questionText();
      buildBoard(); panel();
      say('もとの数を がい数に して、見積もろう。','tip');
      $('ruleBox').classList.remove('show');
      return;
    }
    if(mode==='range'){
      if(rsub==='card'){
        P=makeCards(); step=3; sel=[];
        $('q').innerHTML=questionText();
        buildBoard(); panel();
        say('1まいずつ、四捨五入したら どうなるか たしかめよう。','tip');
        $('ruleBox').classList.remove('show');
        return;
      }
      if(rsub==='scratch'){
        P=makeScratch(); step=3; rin=['','','','']; rbox=0;
        $('q').innerHTML=questionText();
        buildBoard(); panel();
        say('まず、まん中の 数の 左と右の はしを 考えよう。','tip');
        $('ruleBox').classList.remove('show');
        return;
      }
      P=makeRange(); step=3;
      $('q').innerHTML=questionText();
      buildBoard(); panel();
      say('数直線を 見て、はんい を 考えよう。','tip');
      $('ruleBox').classList.remove('show');
      return;
    }
    P=makeProblem(); step=(mode==='round')?1:0;
    $('q').innerHTML=questionText();
    buildBoard(); panel();
    say(mode==='round' ? '四捨五入する けた の数字を タップしよう。'
                       : `${boundaryLabel()}は どれかな？ タップしよう。`,'tip');
    $('ruleBox').classList.remove('show');
  }

  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
      t.setAttribute('aria-selected','true'); mode=t.dataset.mode; fitMin=1; newQ();
    };
  });
  $('ruleBtn').onclick=()=>{ $('ruleBox').classList.toggle('show'); fitScreen(); };

  document.addEventListener('keydown',e=>{
    if(step===3){
      if(e.key==='Enter' && mode==='range' && rsub==='card'){ e.preventDefault(); judgeCards(); }
      else if(/^[0-9]$/.test(e.key)) press(Number(e.key));
      else if(e.key==='Backspace'){ e.preventDefault(); back(); }
    }else if(step===4 && e.key==='Enter') newQ();
  });

  newQ();
})();
</script>
</body>
</html>
